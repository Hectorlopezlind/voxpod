<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VoxPod AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3039/3039396.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3039/3039396.png">

  <style>
    body {
      background-color: #f9fafb;
      margin: 0;
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #root:empty::before {
      content: 'VoxPod AI';
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-weight: 800;
      color: #4f46e5;
      font-size: 1.5rem;
      letter-spacing: -0.05em;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
          .catch((err) => console.log('SW cleanup error:', err));
      });
    }

    if ('caches' in window) {
      window.addEventListener('load', () => {
        caches.keys()
          .then((keys) => Promise.all(keys.filter((key) => key.startsWith('voxpod-')).map((key) => caches.delete(key))))
          .catch((err) => console.log('Cache cleanup error:', err));
      });
    }
  </script>
</body>
</html>
